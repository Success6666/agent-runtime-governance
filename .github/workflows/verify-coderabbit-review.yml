name: Verify CodeRabbit review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: coderabbit-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-coderabbit-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The verifier is intentionally read-only and must evaluate the
          # verifier implementation from the PR head so a corrected review
          # state cannot be shadowed by the protected branch's older script.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const verifyCodeRabbitReview = require(
              "./.github/scripts/verify-coderabbit-review.cjs"
            );
            await verifyCodeRabbitReview({
              github,
              context,
              core,
              maxAttempts: 40,
              intervalMs: 15000,
            });
