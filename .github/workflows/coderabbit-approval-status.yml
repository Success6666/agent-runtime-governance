name: Publish CodeRabbit approval status

on:
  # zizmor: ignore[dangerous-triggers]
  # This workflow publishes status only from trusted default-branch code.
  # The workflow_run path never consumes artifacts or executable content from
  # the unprivileged signal workflow.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [CodeRabbit review signal]
    types: [completed]

concurrency:
  group: >-
    coderabbit-approval-status-${{
      github.event.pull_request.number ||
      github.event.workflow_run.pull_requests[0].number ||
      github.event.workflow_run.id
    }}
  cancel-in-progress: true

jobs:
  publish-coderabbit-approval-status:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.workflow_run.event == 'pull_request_review' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read       # checkout the trusted default-branch script
      pull-requests: read  # read PR head/state and reviews
      issues: read         # read CodeRabbit rate-limit comments
      statuses: write      # publish the CodeRabbit Approval commit status
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const publishCodeRabbitApprovalStatus = require(
              "./.github/scripts/publish-coderabbit-approval-status.cjs"
            );
            const resolvePullRequestNumber = require(
              "./.github/scripts/resolve-pull-request-number.cjs"
            );
            const pullNumber = await resolvePullRequestNumber({ github, context });
            const reviewEvent = context.eventName === "workflow_run";
            await publishCodeRabbitApprovalStatus({
              github,
              context,
              core,
              pullNumber,
              maxAttempts: reviewEvent ? 1 : 40,
              intervalMs: reviewEvent ? 0 : 15000,
              missingState: "pending",
            });
