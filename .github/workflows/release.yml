name: Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-verify-attest:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Resolve release source commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish)"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$RELEASE_TAG"
          encoded_tag="$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_TAG"], safe=""))')"
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$encoded_tag" --jq '.sha')"
          test "$source_sha" != "null"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source belongs to protected main
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip>=26.1.2"
          python -m pip install --disable-pip-version-check -e ".[dev,otel,yaml,prometheus]"

      - name: Run release verification
        run: |
          ruff check .
          node --test .github/scripts/*.test.cjs
          pytest --cov=agent_runtime_governance --cov-report=term-missing
          python integration/production_smoke.py --skip-kind

      - name: Audit isolated production dependencies
        run: |
          python -m venv /tmp/release-audit
          /tmp/release-audit/bin/python -m pip install --disable-pip-version-check --upgrade "pip>=26.1.2"
          /tmp/release-audit/bin/python -m pip install --disable-pip-version-check ".[otel,yaml,prometheus]"
          python -m venv /tmp/release-audit-tool
          /tmp/release-audit-tool/bin/python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
          audit_path="$(/tmp/release-audit/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          /tmp/release-audit-tool/bin/pip-audit --path "$audit_path"

      - name: Verify tag and package version match
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if version != expected:
              raise SystemExit(f"tag {expected!r} does not match package {version!r}")
          PY

      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check "build==1.5.0" "twine==6.2.0"
          python -m build --sdist --wheel
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Verify wheel in an isolated environment
        run: |
          python -m venv /tmp/release-smoke
          /tmp/release-smoke/bin/python -m pip install --disable-pip-version-check --upgrade "pip>=26.1.2"
          /tmp/release-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          cd /tmp
          /tmp/release-smoke/bin/python - <<'PY'
          import os
          import agent_runtime_governance

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if agent_runtime_governance.__version__ != expected:
              raise SystemExit(
                  f"installed package {agent_runtime_governance.__version__!r} does not match {expected!r}"
              )
          PY

      - name: Verify source distribution in an isolated environment
        run: |
          python -m venv /tmp/release-sdist-smoke
          /tmp/release-sdist-smoke/bin/python -m pip install --disable-pip-version-check --upgrade "pip>=26.1.2"
          /tmp/release-sdist-smoke/bin/python -m pip install --disable-pip-version-check dist/*.tar.gz
          cd /tmp
          /tmp/release-sdist-smoke/bin/python - <<'PY'
          import os
          import agent_runtime_governance

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if agent_runtime_governance.__version__ != expected:
              raise SystemExit(
                  f"installed sdist {agent_runtime_governance.__version__!r} does not match {expected!r}"
              )
          PY

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          syft-version: v1.49.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA256 checksums
        run: sha256sum dist/*.whl dist/*.tar.gz dist/sbom.spdx.json > dist/SHA256SUMS

      - name: Verify checksums
        run: sha256sum --check dist/SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/sbom.spdx.json

      - name: Upload verified artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/sbom.spdx.json
          --repo "$GITHUB_REPOSITORY"
